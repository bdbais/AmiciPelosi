plugins {
    id 'com.android.application'
}

// L'indirizzo dell'app viene da gradle.properties o da -PappUrl in fase di build.
def appUrl = (project.findProperty('appUrl') ?: 'https://amicipelosi.pet').toString()
def appHost = new URI(appUrl).host

// La password del keystore non ha un valore di riserva scritto qui: il keystore
// sta nel repository, e una password accanto al keystore e come una chiave
// sotto lo zerbino. Arriva da -PkeystorePassword=... o dall'ambiente
// (KEYSTORE_PASSWORD). Il build debug non ne ha bisogno e non deve fermarsi.
def keystorePassword = (project.findProperty('keystorePassword')
    ?: System.getenv('KEYSTORE_PASSWORD'))?.toString()

gradle.taskGraph.whenReady { graph ->
    def wantsRelease = graph.allTasks.any { it.project == project && it.name.contains('Release') }
    if (wantsRelease && !keystorePassword) {
        throw new GradleException(
            'Manca la password del keystore per il build release.\n' +
            'Passala con  -PkeystorePassword=...  oppure con la variabile d\'ambiente KEYSTORE_PASSWORD.\n' +
            'La chiave e quella della demo (android-demo/signing): la password e in STATO.md.')
    }
}

android {
    namespace 'it.amicipelosi.app'
    compileSdk 35

    defaultConfig {
        applicationId 'it.amicipelosi.app'
        minSdk 23
        targetSdk 35
        // Sopra la demo, che e arrivata alla 6: quando l'app vera prende il
        // posto sullo stesso identificativo, Android deve vederla come piu
        // recente, altrimenti rifiuta di installarla.
        versionCode 11
        versionName '1.1'

        resValue 'string', 'launch_url', appUrl
        resValue 'string', 'app_host', appHost
    }

    // La stessa chiave della demo: Android accetta un aggiornamento solo se e
    // firmato come quello gia installato, e questa app prende il posto di
    // quella sullo stesso identificativo. La password arriva da fuori (vedi
    // keystorePassword in cima): senza, il build release si ferma con un
    // messaggio invece di fallire piu avanti su un errore di firma illeggibile.
    signingConfigs {
        release {
            storeFile file(project.findProperty('keystoreFile')
                ?: '../../android-demo/signing/amicipelosi-demo.keystore')
            keyAlias (project.findProperty('keystoreAlias') ?: 'amicipelosi').toString()
            if (keystorePassword) {
                storePassword keystorePassword
                keyPassword keystorePassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Trusted Web Activity: l'app apre il sito dentro il motore di Chrome,
    // cosi restano attive notifiche push, GPS e fotocamera.
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
