<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4a15c"/>
      <stop offset="0.55" stop-color="#e07a3f"/>
      <stop offset="1" stop-color="#c8551f"/>
    </linearGradient>
    <linearGradient id="heart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffe9d8"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="115" fill="url(#bg)"/>

  <!-- Cuore: il palmo della zampa -->
  <path d="M256 424
           C 150 352, 96 296, 96 232
           C 96 184, 133 150, 178 150
           C 208 150, 236 166, 256 194
           C 276 166, 304 150, 334 150
           C 379 150, 416 184, 416 232
           C 416 296, 362 352, 256 424 Z"
        fill="url(#heart)"/>

  <!-- Polpastrelli, disposti come su una zampa vera -->
  <g fill="url(#heart)">
    <ellipse cx="128" cy="150" rx="36" ry="45" transform="rotate(-24 128 150)"/>
    <ellipse cx="384" cy="150" rx="36" ry="45" transform="rotate(24 384 150)"/>
    <ellipse cx="196" cy="86" rx="33" ry="42" transform="rotate(-10 196 86)"/>
    <ellipse cx="316" cy="86" rx="33" ry="42" transform="rotate(10 316 86)"/>
  </g>

  <!-- Battito: la vita che pulsa dentro il cuore -->
  <path d="M170 258 h44 l20 -38 l26 76 l22 -50 l16 26 h44"
        fill="none" stroke="#e07a3f" stroke-width="17"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
